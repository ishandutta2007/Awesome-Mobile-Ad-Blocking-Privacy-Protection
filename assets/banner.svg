apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:38px;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:16px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.pulsing-circle-1,.pulsing-circle-2{animation:pulseRing 3.5s cubic-bezier(.215,.61,.355,1) infinite;transform-origin:1030px 180px}.pulsing-circle-2{animation:pulseRing 3.5s cubic-bezier(.215,.61,.355,1) infinite 1.75s}.floating-node-1{animation:floatParticle 4s ease-in-out infinite}.floating-node-2{animation:floatParticle 5s ease-in-out infinite 1s}.floating-node-3{animation:floatParticle 4.5s ease-in-out infinite 2s}.stream-line{stroke-dasharray:8 6;animation:dataStream 2s linear infinite}.shield-icon{animation:shieldGlow 4s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)"/><rect width="1200" height="360" fill="url(#grid)"/><circle cx="1030" cy="180" r="160" fill="#38bdf8" fill-opacity=".08" filter="url(#glow)"/><circle cx="150" cy="90" r="120" fill="#6366f1" fill-opacity=".06" filter="url(#glow)"/><g id="dynamic-radar" opacity=".85"><circle cx="1030" cy="180" r="40" fill="none" stroke="#38bdf8" stroke-width="2" class="pulsing-circle-1"/><circle cx="1030" cy="180" r="40" fill="none" stroke="#818cf8" stroke-width="1.5" class="pulsing-circle-2"/><circle cx="1030" cy="180" r="110" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="1030" cy="180" r="145" fill="none" stroke="#1e293b" stroke-width="1"/><path fill="none" stroke="#06b6d4" stroke-width="1.8" d="M 870 120 L 980 150" class="stream-line"/><path fill="none" stroke="#a855f7" stroke-width="1.8" d="M 850 240 L 970 210" class="stream-line"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 1120 120 L 1180 90" class="stream-line"/><g class="floating-node-1"><rect width="130" height="34" x="850" y="70" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" rx="17"/><circle cx="868" cy="87" r="5" fill="#10b981"/><text x=