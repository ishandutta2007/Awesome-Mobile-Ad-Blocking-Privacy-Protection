<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    /* Dynamic pulsing and flow animations */
    @keyframes pulseRing {
      0% { r: 35px; opacity: 0.8; }
      50% { r: 70px; opacity: 0.2; }
      100% { r: 105px; opacity: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shieldGlow {
      0% { filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 28px rgba(99, 102, 241, 0.7)); }
      100% { filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4)); }
    }
    .pulsing-circle-1 {
      animation: pulseRing 3.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      transform-origin: 1030px 180px;
    }
    .pulsing-circle-2 {
      animation: pulseRing 3.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 1.75s;
      transform-origin: 1030px 180px;
    }
    .floating-node-1 {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .floating-node-2 {
      animation: floatParticle 5s ease-in-out infinite 1s;
    }
    .floating-node-3 {
      animation: floatParticle 4.5s ease-in-out infinite 2s;
    }
    .stream-line {
      stroke-dasharray: 8 6;
      animation: dataStream 2s linear infinite;
    }
    .shield-icon {
      animation: shieldGlow 4s ease-in-out infinite;
    }
  </style>

  <!-- Deep Cyber Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Ambient background glow behind visual elements -->
  <circle cx="1030" cy="180" r="160" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="150" cy="90" r="120" fill="#6366f1" fill-opacity="0.06" filter="url(#glow)"/>

  <!-- Dynamic Radar / DNS Shield Animation Elements (Positioned in Right/Background) -->
  <g id="dynamic-radar" opacity="0.85">
    <!-- Concentric radar waves -->
    <circle class="pulsing-circle-1" cx="1030" cy="180" r="40" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle class="pulsing-circle-2" cx="1030" cy="180" r="40" fill="none" stroke="#818cf8" stroke-width="1.5"/>

    <!-- Orbital Track & Data Nodes -->
    <circle cx="1030" cy="180" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1030" cy="180" r="145" fill="none" stroke="#1e293b" stroke-width="1"/>

    <!-- Dynamic Stream Lines -->
    <path class="stream-line" d="M 870 120 L 980 150" fill="none" stroke="#06b6d4" stroke-width="1.8"/>
    <path class="stream-line" d="M 850 240 L 970 210" fill="none" stroke="#a855f7" stroke-width="1.8"/>
    <path class="stream-line" d="M 1120 120 L 1180 90" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Floating Security Nodes (Ad Blockers / DNS Queries / Trackers Stopped) -->
    <g class="floating-node-1">
      <rect x="850" y="70" width="130" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="868" cy="87" r="5" fill="#10b981"/>
      <text x="882" y="92" class="badge-text" font-size="12">DoH / DoT Encrypted</text>
    </g>

    <g class="floating-node-2">
      <rect x="830" y="250" width="145" height="34" rx="17" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="848" cy="267" r="5" fill="#ef4444"/>
      <text x="862" y="272" class="badge-text" font-size="12">Tracker Dropped 🛡️</text>
    </g>

    <g class="floating-node-3">
      <rect x="1040" y="45" width="125" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
      <circle cx="1058" cy="62" r="5" fill="#38bdf8"/>
      <text x="1072" y="67" class="badge-text" font-size="12">0.0.0.0 Sinkhole</text>
    </g>

    <!-- Main Central Shield & Mobile Device Graphic -->
    <g class="shield-icon" transform="translate(1030, 180)">
      <!-- Mobile Phone Outline Behind Shield -->
      <rect x="-35" y="-55" width="70" height="110" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2.5"/>
      <rect x="-26" y="-45" width="52" height="90" rx="4" fill="#020617"/>
      <!-- Notch & Home Bar -->
      <line x1="-10" y1="-50" x2="10" y2="-50" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="-12" y1="40" x2="12" y2="40" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

      <!-- Glowing Privacy Shield -->
      <path d="M 0 -32 L 26 -18 C 26 12 14 30 0 38 C -14 30 -26 12 -26 -18 Z" 
            fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2" filter="url(#subtleGlow)"/>
      <path d="M -8 -1 L -2 5 L 10 -7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Foreground Content: Header, Badges & Subtitle -->
  <!-- Header Text -->
  <g transform="translate(70, 75)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="26" y="19" class="badge-text" fill="#38bdf8" font-size="11" letter-spacing="1">CURATED PRIVACY ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="68" class="title-text" fill="url(#textGrad)">Mobile Ad Blocking &amp;</text>
    <text x="0" y="112" class="title-text" fill="#f8fafc">Privacy Protection</text>

    <!-- Subtitle -->
    <text x="0" y="152" class="subtitle-text">System-Wide Android &amp; iOS DNS Filtering, VPN Loopbacks, Encrypted DoH/DoT &amp; Sinkholes</text>

    <!-- Tech Pills Row -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: Android & iOS -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" class="badge-text">📱 iOS &amp; Android</text>

      <!-- Pill 2: DoH / DoT / DoQ -->
      <rect x="142" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="156" y="22" class="badge-text">⚡ Encrypted DNS</text>

      <!-- Pill 3: DNS Sinkholes -->
      <rect x="284" y="0" width="125" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="298" y="22" class="badge-text">🕳️ DNS Sinkholes</text>

      <!-- Pill 4: Open Source -->
      <rect x="421" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="435" y="22" class="badge-text">⭐ Open Source</text>

      <!-- Pill 5: Zero Telemetry -->
      <rect x="563" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="577" y="22" class="badge-text">🔒 Zero Telemetry</text>
    </g>
  </g>
</svg>
